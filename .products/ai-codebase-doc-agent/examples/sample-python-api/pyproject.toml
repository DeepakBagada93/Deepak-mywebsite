[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-python-api"
version = "0.1.0"
description = "A sample FastAPI application demonstrating the codebase documentation agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic[email]",
]

[tool.ruff]
line-length = 100
target-version = "py311"