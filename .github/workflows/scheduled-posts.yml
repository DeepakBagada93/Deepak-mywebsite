name: Scheduled Posts Sweep

# Server-side scheduler fallback: if Hostinger cron is unavailable, this
# workflow triggers the due-slot sweep every 10 minutes by SSHing into
# Hostinger and running the Laravel scheduler (which runs
# `blog:process-scheduled --quiet`). Manual runs supported via dispatch.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scheduler on Hostinger
        env:
          SSH_RAW_OR_B64: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          if echo "$SSH_RAW_OR_B64" | grep -q "BEGIN OPENSSH"; then
            printf "%s\n" "$SSH_RAW_OR_B64" > ~/.ssh/deploy_key
          else
            echo "$SSH_RAW_OR_B64" | tr -d '\r ' | base64 -d > ~/.ssh/deploy_key 2>/dev/null || printf "%s\n" "$SSH_RAW_OR_B64" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 65002 -H 86.38.243.124 >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p 65002 -o StrictHostKeyChecking=no u775719140@86.38.243.124 \
            "cd domains/deepakbagada.in/public_html && php artisan schedule:run >> storage/logs/scheduled-posts.log 2>&1 || php artisan blog:process-scheduled --quiet >> storage/logs/scheduled-posts.log 2>&1"
