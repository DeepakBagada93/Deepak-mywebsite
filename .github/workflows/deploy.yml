name: Deploy to Hostinger public_html

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy site to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Sync files via FTP/SFTP to Hostinger public_html
        uses: SamKirsch/ftp-deploy-action@4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          # Exclude git internal files and scratch files
          exclude: |
            **/.git*
            **/.git*/**
            **/generate_test_post.py
            **/migrate.py
