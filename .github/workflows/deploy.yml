name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer, pint

      - name: Check PHP syntax
        run: find app/ database/ routes/ -name "*.php" -exec php -l {} \;

      - name: Run Pint (style)
        run: pint --test

  migration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Validate migrations
        run: |
          php -r "
            \$files = glob('database/migrations/*.php');
            foreach (\$files as \$f) {
              echo '✓ ' . basename(\$f) . PHP_EOL;
            }
          "

  journal-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Validate journal source file
        run: |
          php .github/scripts/check-journal-freshness.php
          php -l data/posts.php
          php -l app/Models/Post.php
          php -l database/seeders/PostSeeder.php
      - name: Guard against destructive post sync
        run: |
          # PostSeeder must stay upsert-only. A reseed that deletes rows wipes
          # posts published directly to the live DB and empties /journal.
          if grep -n "table('posts')" -A4 database/seeders/PostSeeder.php | grep -q -- "->delete()"; then
            echo "FAIL: PostSeeder contains a delete() on the posts table — deploy would wipe live-only posts."
            exit 1
          fi
          echo "PostSeeder delete-guard PASS."

  deploy:
    needs: [quality, migration-check, journal-freshness]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup SSH Key & Deploy to Hostinger
        env:
          SSH_RAW_OR_B64: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          
          # Decode if base64 or write raw with proper newlines
          if echo "$SSH_RAW_OR_B64" | grep -q "BEGIN OPENSSH"; then
            printf "%s\n" "$SSH_RAW_OR_B64" > ~/.ssh/deploy_key
          else
            echo "$SSH_RAW_OR_B64" | tr -d '\r ' | base64 -d > ~/.ssh/deploy_key 2>/dev/null || printf "%s\n" "$SSH_RAW_OR_B64" > ~/.ssh/deploy_key
          fi
          
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 65002 -H 86.38.243.124 >> ~/.ssh/known_hosts

          # Sync files directly to Hostinger
          rsync -avz --no-owner --no-group -e "ssh -i ~/.ssh/deploy_key -p 65002 -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/framework/scheduled-posts.lock' \
            --exclude='storage/framework/schedule-heartbeat.txt' \
            --exclude='storage/framework/schedule-failures.json' \
            ./ u775719140@86.38.243.124:domains/deepakbagada.in/public_html/

          # Sync posts to MySQL + build caches on Hostinger.
          # PostSeeder is upsert-only (never deletes), so posts published
          # directly to the live DB survive every deploy.
          ssh -i ~/.ssh/deploy_key -p 65002 -o StrictHostKeyChecking=no u775719140@86.38.243.124 \
            "cd domains/deepakbagada.in/public_html && chmod -R 775 storage bootstrap/cache && php artisan db:seed --class=PostSeeder --force && php artisan config:cache && php artisan route:cache && php artisan view:cache"

      - name: Verify journal shows latest post
        env:
          SSH_RAW_OR_B64: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          if echo "$SSH_RAW_OR_B64" | grep -q "BEGIN OPENSSH"; then
            printf "%s\n" "$SSH_RAW_OR_B64" > ~/.ssh/deploy_key
          else
            echo "$SSH_RAW_OR_B64" | tr -d '\r ' | base64 -d > ~/.ssh/deploy_key 2>/dev/null || printf "%s\n" "$SSH_RAW_OR_B64" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          LATEST_SLUG=$(php -r '$p=require "data/posts.php"; usort($p, fn($a,$b)=>(strcmp($b["published_at"]??"", $a["published_at"]??"") ?: strcmp($a["slug"]??"", $b["slug"]??""))); foreach($p as $x){ if(!preg_match("/-(variant-\d+|v\d+)$/",$x["slug"])){ echo $x["slug"]; break; }}')
          echo "Expecting latest post on live journal: $LATEST_SLUG"
          for i in 1 2 3; do
            if curl -sL "https://deepakbagada.in/journal" | grep -q "$LATEST_SLUG"; then
              echo "Journal freshness VERIFIED — latest post is live."
              exit 0
            fi
            echo "Retry $i/3 — latest slug not yet on /journal, waiting 15s..."
            sleep 15
          done
          echo "FAIL: /journal does not list latest post $LATEST_SLUG after deploy."
          exit 1
