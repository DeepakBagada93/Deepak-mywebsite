name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer, pint

      - name: Check PHP syntax
        run: find app/ database/ routes/ -name "*.php" -exec php -l {} \;

      - name: Run Pint (style)
        run: pint --test

  migration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Validate migrations
        run: |
          php -r "
            \$files = glob('database/migrations/*.php');
            foreach (\$files as \$f) {
              echo '✓ ' . basename(\$f) . PHP_EOL;
            }
          "

  deploy:
    needs: [quality, migration-check]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup SSH Key & Deploy to Hostinger
        env:
          SSH_RAW_OR_B64: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          
          # Decode if base64 or write raw with proper newlines
          if echo "$SSH_RAW_OR_B64" | grep -q "BEGIN OPENSSH"; then
            printf "%s\n" "$SSH_RAW_OR_B64" > ~/.ssh/deploy_key
          else
            echo "$SSH_RAW_OR_B64" | tr -d '\r ' | base64 -d > ~/.ssh/deploy_key 2>/dev/null || printf "%s\n" "$SSH_RAW_OR_B64" > ~/.ssh/deploy_key
          fi
          
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 65002 -H 86.38.243.124 >> ~/.ssh/known_hosts

          # Sync files directly to Hostinger
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -p 65002 -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            ./ u775719140@86.38.243.124:domains/deepakbagada.in/public_html/

          # Build and optimize caches on Hostinger
          ssh -i ~/.ssh/deploy_key -p 65002 -o StrictHostKeyChecking=no u775719140@86.38.243.124 \
            "cd domains/deepakbagada.in/public_html && chmod -R 775 storage bootstrap/cache && php artisan config:cache && php artisan route:cache && php artisan view:cache"
